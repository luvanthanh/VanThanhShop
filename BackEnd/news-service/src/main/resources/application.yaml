server:
  port: 8083

spring:
  application:
    name: news-service

  datasource:
    url: jdbc:mysql://mysql:3306/NewsDatabase
    username: root
    password: "123456"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-service:8761/eureka