<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233f">
  <title>Đăng nhập quản trị | VAN THANH SHOP</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand brand-login" href="LoginAdmin.html" aria-label="VAN THANH SHOP">
      <span class="brand-mark">VT</span>
      <span>VAN THANH <b>SHOP</b></span>
    </a>
    <p class="eyebrow">KHU VỰC QUẢN TRỊ</p>
    <h1>Chào mừng trở lại</h1>
    <p class="muted">Đăng nhập bằng tài khoản quản trị của bạn.</p>
    <form id="login-form" class="form-stack">
      <label>Tên đăng nhập
        <input name="userName" autocomplete="username" required maxlength="100">
      </label>
      <label>Mật khẩu
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-message" class="form-message" role="alert"></p>
      <button class="button button-primary button-wide" type="submit">Đăng nhập</button>
    </form>
    <p class="login-footnote">Tài khoản cần có quyền ADMIN do hệ thống xác thực cấp.</p>
  </main>
  <script type="module" src="../javascript/login.js"></script>
</body>
</html>
