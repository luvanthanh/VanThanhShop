<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <link rel="stylesheet" href="../css/CreateAccout.css">
    <script defer src="../javaScript/CreateAccout.js"></script>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="brand-panel">
                <div class="brand-badge">
                    VT
                </div>
                <p class="brand-tag">Van Thanh Shop</p>
                <h1>Tạo tài khoản mới</h1>
                <p class="brand-text">
                    Đăng ký để trải nghiệm mua sắm nhanh chóng, an toàn và thuận tiện hơn.
                </p>

                <ul class="feature-list">
                    <li>Ưu đãi thành viên độc quyền</li>
                    <li>Giỏ hàng và đơn hàng được lưu tự động</li>
                    <li>Hỗ trợ nhanh chóng 24/7</li>
                </ul>
            </div>

            <div class="register">
                <h2>Đăng ký tài khoản</h2>

                <div class="field-row">
                    <div class="form-group">
                        <label for="userName">Tên đăng nhập</label>
                        <input type="text" id="userName" placeholder="Nhập tên đăng nhập">
                    </div>

                    <div class="form-group">
                        <label for="userPassword">Mật khẩu</label>
                        <input type="password" id="userPassword" placeholder="Nhập mật khẩu">
                    </div>
                </div>

                <div class="field-row">
                    <div class="form-group">
                        <label for="userLastName">Họ</label>
                        <input type="text" id="userLastName" placeholder="Lù">
                    </div>

                    <div class="form-group">
                        <label for="userFirstName">Tên</label>
                        <input type="text" id="userFirstName" placeholder="Văn">
                    </div>
                </div>

                <div class="form-group">
                    <label for="userAddress">Địa chỉ</label>
                    <input type="text" id="userAddress" placeholder="Nhập địa chỉ của bạn">
                </div>

                <div class="field-row">
                    <div class="form-group">
                        <label for="userEmail">Email</label>
                        <input type="email" id="userEmail" placeholder="example@gmail.com">
                    </div>

                    <div class="form-group">
                        <label for="userPhoneNumber">SĐT</label>
                        <input type="tel" id="userPhoneNumber" placeholder="0987 654 321">
                    </div>
                </div>

                <button type="submit" id="register_button">Đăng ký</button>

                <p class="login-link">
                    Bạn đã có tài khoản?
                    <a href="#">Đăng nhập ngay</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
