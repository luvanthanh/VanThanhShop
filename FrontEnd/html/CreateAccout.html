<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <link rel="stylesheet" href="../css/CreateAccout.css">
    <script defer src="../javaScript/CreateAccout.js"></script>
</head>

<body>
    <div class="register">
        <h2>Đăng ký tài khoản</h2>

        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" id="userName">
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="userPassword">
        </div>

        <div class="form-group">
            <label>Họ</label>
            <input type="text" id="userLastName">
        </div>

        <div class="form-group">
            <label>Tên</label>
            <input type="text" id="userFirstName">
        </div>

        <div class="form-group">
            <label>Địa chỉ</label>
            <input type="text" id="userAddress">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="userEmail">
        </div>

        <div class="form-group">
            <label>SĐT</label>
            <input type="tel" id="userPhoneNumber">
        </div>

        <button id="register_button">Đăng ký</button>
    </div>
</body>
</html>
