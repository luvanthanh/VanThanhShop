services:
  mysql:
    image: mysql:8.0
    container_name: vanthanhshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "3333:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d:ro
    networks:
      - vanthanh-network

volumes:
  mysql_data:

networks:
  vanthanh-network:
    driver: bridge