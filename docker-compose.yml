
services:
  mysql:
    image: mysql:8.0
    container_name: vanthanhshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "3333:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d:ro
    networks:
      - vanthanh-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-service:
    build:
      context: ./BackEnd/eureka-service
    container_name: vanthanhshop-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - vanthanh-network

  user-service:
    build:
      context: ./BackEnd/user-service
    container_name: vanthanhshop-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-service:
        condition: service_started
    networks:
      - vanthanh-network

  product-service:
    build:
      context: ./BackEnd/product-service
    container_name: vanthanhshop-product
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-service:
        condition: service_started
    networks:
      - vanthanh-network

  cart-service:
    build:
      context: ./BackEnd/cart-service
    container_name: vanthanhshop-cart
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-service:
        condition: service_started
    networks:
      - vanthanh-network

  order-service:
    build:
      context: ./BackEnd/order-service
    container_name: vanthanhshop-order
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-service:
        condition: service_started
    networks:
      - vanthanh-network

  news-service:
    build:
      context: ./BackEnd/news-service
    container_name: vanthanhshop-news
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-service:
        condition: service_started
    networks:
      - vanthanh-network

  api-gateway:
    build:
      context: ./BackEnd/api-gateway
    container_name: vanthanhshop-gateway
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      - eureka-service
      - user-service
      - product-service
      - cart-service
      - order-service
      - news-service
    networks:
      - vanthanh-network

volumes:
  mysql_data:

networks:
  vanthanh-network:
    driver: bridge
